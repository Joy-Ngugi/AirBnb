<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact - Tranquil Stays</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div class="logo">Tranquil Stays</div>
    <div class="menu-toggle" id="menu-toggle">&#9776;</div>
    <nav id="navbar">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="rooms.html">Rooms</a></li>
        <li><a href="gallery.html">Gallery</a></li>
        <li><a href="booking.html">Booking</a></li>
        <li><a href="blog.html">Blog</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
    </nav>
  </header>

  <section class="contact-form">
    <h2>Contact Us</h2>
    <form id="contact-form">
      <label for="fullname">Full Name</label>
      <input type="text" id="fullname" required />

      <label for="email">Email Address</label>
      <input type="email" id="email" required />

      <label for="message">Message</label>
      <textarea id="message" required></textarea>

      <button type="submit" class="btn">Send Message</button>
    </form>
    <div class="map">
      <h3>Find Us Here:</h3>
      <iframe src="https://maps.google.com/maps?q=Mountains&t=&z=13&ie=UTF8&iwloc=&output=embed" frameborder="0"></iframe>
    </div>
  </section>

  <footer>
    <p>&copy; 2025 Tranquil Stays. All rights reserved.</p>
  </footer>
  <script src="script.js"></script>
</body>
</html>
